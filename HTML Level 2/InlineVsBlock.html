<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Vs Block Elements</title>
</head>
<body>
    <!-- Block Elements -->
    <h1>Hello world</h1>
    <h1>My College</h1>
    <p>This is a paragraph.</p>

    <!-- Inline elements -->
    <a href="https://www.google.com">Google</a>
    <a href="https://www.facebook.com">Facebook</a>
    <a href="https://www.youtube.com">Youtube</a>

    <img src="img.jpg" alt="Image" height="200px">
    <img src="https://www.mamp.one/wp-content/uploads/2024/09/image-resources2.jpg" alt="Cat Image" height="200px">
</body>
</html>
