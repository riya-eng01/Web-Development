<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List in HTML</title>
</head>
<body>
    <h2>Unordered List</h2>
    <ul type="disc">
        <li>Bread</li>
        <li>Jam</li>
        <li>Butter
            <!-- Other Tags nested inside list tag -->
            <h3>Brands</h3>
            <ol type="i">
                <li>Amul Butter</li>
                <li>Mother Dairy Butter</li>
            </ol>
        </li>
    </ul>

    <h2>Ordered List</h2>
    <ol type="1">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>
</body>
</html>
