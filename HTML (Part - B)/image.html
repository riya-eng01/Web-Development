<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Tag</title>
</head>
<body>
    <!-- Relative URL -->
    <h2>This is a vision Board image</h2>
    <img src="img.jpg" alt="Collage" height="400px">

    <!-- Absolute Url -->
    <h2>A Beautiful Image</h2>
    <img src="https://www.equinetmedia.com/hubfs/How-to-find-b2b-blog-images.png" alt="Neon Night Tree View">
</body>
</html>
