<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More HTML Tags</title>
</head>
<body>
    <!-- Br Tag -->
    <!-- Bold, italic, underline -->
    <h1>Our Childhood Poem</h1>
    <p>Twinkle Twinkle Little <b>star</b> <br>
        How I <i>wonder</i> what you are <br>
        Up above the world so high! <br>
        Like a <u>diamond in the Sky!</u> <br>
    </p>

    <!-- Comments in HTML -->
    <!-- This is an HTML Comment! -->

    <!-- HTML is Case-Sensitive Language -->
    <H3>Html is a Case Sensitive Language.</H3>
</body>
</html>
