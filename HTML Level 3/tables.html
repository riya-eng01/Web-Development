<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <table border="black">
        <caption>Student Data</caption>
        <thead>
            <tr>
                <th>Name</th>
                <th>Roll No</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Riya</td>
                <td>20</td>
            </tr>
            <tr>
                <td>Harshit</td>
                <td>34</td>
            </tr>
            <tr>
                <td>Shreya</td>
                <td>89</td>
            </tr>
        </tbody>
    </table>
    <br><br>

    <!-- Food Menu -->
    <table border="black">
        <caption>Food Menu</caption>
        <!-- Table Header -->
        <thead>
            <tr>
                <th>Item</th>
                <th>Price</th>
            </tr>
        </thead>
        <!-- Table Body -->
        <tbody>
            <tr>
                <td>Frooti</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Samosa</td>
                <td>20</td>
            </tr>
            <tr>
                <td>Chips</td>
                <td>30</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Total</td>
                <td>60</td>
            </tr>
        </tfoot>
    </table>
    
</body>
</html>
