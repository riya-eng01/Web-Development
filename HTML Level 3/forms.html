<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms in HTML</title>
</head>
<body>
    <form action="/action">
        <label for="name">Usrename: </label>
        <input type="text" id="name" placeholder="Enter Name" name="user">

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter email">

        <label for="age">Age</label>
        <input type="number" id="age" placeholder="Enter age">

        <label for="pass">Password: </label>
        <input type="password" id="pass" placeholder="Enter password" name="pass">

        <!-- different types of buttons -->
        <button>Submit</button>
        <button type="submit">submit</button>
        <button type="button">Button</button>
        <button type="reset">Reset</button>

        <!-- button using input -->
        <input type="button" value="Click me">
        <input type="submit" >
    </form>
    <hr>
    <!-- Another form -->
    <form action="https://www.youtube.com/results?">
        <input type="text" placeholder="Search in youtube" name="search_query">
        <button>Search</button>
    </form>
</body>
</html>
