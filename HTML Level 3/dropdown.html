<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdowns</title>
</head>
<body>
    <form action="/server">
        <!-- dropdowns -->
        <label for="prof">Profession: </label>
        <select name="profession" id="prof">
            <option >Select option</option>
            <option value="stu">Student</option>
            <option value="web-dev">Web Developer</option>
            <option value="teach">Teacher</option>
            <option value="oth">Other</option>
        </select>

        <hr>

        <label for="country">Country: </label>
        <select name="country" id="country">
            <option>Select Country</option>
            <option value="ind">India</option>
            <option value="usa">USA</option>
            <option value="eng">England</option>
            <option value="nep">Nepal</option>
        </select>

        <hr>
        <!-- Input Range -->
        <label for="vol"> Select Volume level: </label>
        <input type="range" name="vol" id="vol" min="0" max="100" step="10" value="30">

        <button>Submit</button>
    </form>
</body>
</html>
